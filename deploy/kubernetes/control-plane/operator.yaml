apiVersion: apps/v1
kind: Deployment
metadata:
  name: splai-operator
  namespace: splai-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: splai-operator
  template:
    metadata:
      labels:
        app: splai-operator
    spec:
      serviceAccountName: splai-operator
      containers:
        - name: operator
          image: ghcr.io/mchenetz/splai-operator:v0.1.0
          env:
            - name: SPLAI_OPERATOR_WORKER_STALE_AFTER_SECONDS
              value: "20"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: splai-operator
  namespace: splai-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: splai-operator
rules:
  - apiGroups: ["splai.io"]
    resources: ["splaijobs", "splaiworkers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["splai.io"]
    resources: ["splaijobs/status", "splaiworkers/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: splai-operator
subjects:
  - kind: ServiceAccount
    name: splai-operator
    namespace: splai-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: splai-operator
