{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "splai.fullname" . }}-worker
spec:
  selector:
    matchLabels:
      app: {{ include "splai.fullname" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "splai.fullname" . }}-worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: SPLAI_CONTROL_PLANE_URL
              value: http://{{ include "splai.fullname" . }}-api-gateway:{{ .Values.apiGateway.service.port }}
            - name: SPLAI_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SPLAI_ARTIFACT_ROOT
              value: {{ .Values.worker.artifactRoot | quote }}
            - name: SPLAI_MAX_PARALLEL_TASKS
              value: {{ .Values.worker.maxParallelTasks | quote }}
            - name: SPLAI_HEARTBEAT_SECONDS
              value: {{ .Values.worker.heartbeatSeconds | quote }}
            - name: SPLAI_POLL_MILLIS
              value: {{ .Values.worker.pollMillis | quote }}
{{- with .Values.worker.extraEnv }}
{{ toYaml . | indent 12 }}
{{- end }}
          volumeMounts:
            - name: artifact-dir
              mountPath: {{ .Values.worker.artifactRoot | quote }}
{{- if .Values.worker.ollama.enabled }}
        - name: ollama
          image: "{{ .Values.worker.ollama.image.repository }}:{{ .Values.worker.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.worker.ollama.image.pullPolicy }}
{{- with .Values.worker.ollama.args }}
          args:
{{ toYaml . | indent 12 }}
{{- end }}
          env:
            - name: OLLAMA_HOST
              value: {{ printf "%s:%v" .Values.worker.ollama.host .Values.worker.ollama.port | quote }}
            - name: HOME
              value: {{ .Values.worker.ollama.modelsPath | quote }}
            - name: OLLAMA_MODELS
              value: {{ .Values.worker.ollama.modelsPath | quote }}
{{- with .Values.worker.ollama.extraEnv }}
{{ toYaml . | indent 12 }}
{{- end }}
          ports:
            - containerPort: {{ .Values.worker.ollama.port }}
          readinessProbe:
            httpGet:
              path: /api/tags
              port: {{ .Values.worker.ollama.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/tags
              port: {{ .Values.worker.ollama.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.worker.ollama.resources | indent 12 }}
          volumeMounts:
            - name: ollama-data
              mountPath: {{ .Values.worker.ollama.modelsPath | quote }}
{{- end }}
      volumes:
        - name: artifact-dir
{{- $volType := default "emptyDir" .Values.worker.volume.type }}
{{- if eq $volType "hostPath" }}
          hostPath:
            path: {{ default .Values.worker.artifactRoot .Values.worker.volume.hostPath | quote }}
            type: DirectoryOrCreate
{{- else if eq $volType "ephemeralPVC" }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
{{ toYaml .Values.worker.volume.ephemeralPVC.accessModes | indent 18 }}
                resources:
                  requests:
                    storage: {{ .Values.worker.volume.ephemeralPVC.size | quote }}
{{- if .Values.worker.volume.ephemeralPVC.storageClassName }}
                storageClassName: {{ .Values.worker.volume.ephemeralPVC.storageClassName | quote }}
{{- end }}
{{- else }}
          emptyDir: {}
{{- end }}
{{- if .Values.worker.ollama.enabled }}
        - name: ollama-data
{{- $ollamaVolType := default "emptyDir" .Values.worker.ollama.dataVolume.type }}
{{- if eq $ollamaVolType "hostPath" }}
          hostPath:
            path: {{ default "/var/lib/ollama" .Values.worker.ollama.dataVolume.hostPath | quote }}
            type: DirectoryOrCreate
{{- else }}
{{- if .Values.worker.ollama.dataVolume.sizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.worker.ollama.dataVolume.sizeLimit | quote }}
{{- else }}
          emptyDir: {}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
